version: "3.9"

services:
  smartcrop-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcrop_ai_platform
    ports:
      - "8501:8501"  # Streamlit Frontend Web App
      - "8000:8000"  # FastAPI Backend API
    environment:
      - PORT=8501
      - BACKEND_PORT=8000
      - YOLO_AUTOINSTALL=False
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

